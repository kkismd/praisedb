# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
#
default: &default
  adapter: postgresql
  encoding: utf8
  username: docker
  password: docker
  pool: 5
  host: <%= ENV['DB_HOST'] || 'localhost' %>

development:
  <<: *default
  # adapter: mysql2
  # host: db
  adapter: postgresql
  host: pg
  # database: ginmaku
  # database: tlc_20241027
  database: tlc_20241108

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  # adapter: mysql2
  # host: db
  # database: ginmaku_test
  adapter: postgresql
  host: pg
  database: ginmaku_test

production:
  <<: *default
  database: ginmaku_production
