services:
  app: &app_base      # rails server用コンテナ
    build:            # Dockerfileを実行し、ビルドされる時のパス指定
      context: .
      dockerfile: Dockerfile.podman
    volumes:          # マウントする設定ファイルのパス指定
      - .:/app
    ports:            # port番号（docker:host）
      - "3000:3000"
    depends_on:       # Service同士の依存関係
      - pg
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    environment:
      RAILS_ENV: development
      DB_HOST: pg
    tty: true         # railsのデバッグを使用するための設定
    stdin_open: true  # 同上
  webpack-dev-server:
    build:
      context: .
      dockerfile: Dockerfile.podman
    command: yarn run webpack --watch
    volumes:          # マウントする設定ファイルのパス指定
      - .:/app
    ports:
      - "8081:8081"
    depends_on:
      - pg
  pg:
    image: postgres:16
    volumes:
      - postgres:/var/lib/postgresql/data
      - .:/home
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      # POSTGRES_DB: ginmaku
      TZ: 'Asia/Tokyo'
    ports:
      - "5432:5432"

volumes:
  postgres:
    driver: local
